# Copy to github-repo-secret.yaml (git-ignored), fill in a fine-grained PAT with
# read access to this repo, then: kubectl apply -f argocd/github-repo-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: github-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo
stringData:
  type: git
  url: https://github.com/Ano0nymous/shopsphere.git
  username: Ano0nymous
  password: <GITHUB_PAT>
