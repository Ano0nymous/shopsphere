apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopsphere-prod

resources:
  - ../../base

# CI updates newTag to the commit SHA on every merge to main (never :latest).
images:
  - { name: user-service,         newName: shopsphereacr.azurecr.io/user-service,         newTag: latest }
  - { name: product-service,      newName: shopsphereacr.azurecr.io/product-service,      newTag: latest }
  - { name: cart-service,         newName: shopsphereacr.azurecr.io/cart-service,         newTag: latest }
  - { name: order-service,        newName: shopsphereacr.azurecr.io/order-service,        newTag: latest }
  - { name: payment-service,      newName: shopsphereacr.azurecr.io/payment-service,      newTag: latest }
  - { name: notification-service, newName: shopsphereacr.azurecr.io/notification-service, newTag: latest }
  - { name: frontend,             newName: shopsphereacr.azurecr.io/frontend,             newTag: latest }

# Copy secrets.env.example -> secrets.env (git-ignored) and fill in real values.
# With Argo CD, apply the secret out-of-band instead (kubectl / Sealed Secrets / External Secrets):
#   kubectl -n shopsphere-prod create secret generic shopsphere-secrets --from-env-file=secrets.env
secretGenerator:
  - name: shopsphere-secrets
    options:
      disableNameSuffixHash: true
    envs:
      - secrets.env
