apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shopsphere-services
  labels:
    release: monitoring
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [user-service, product-service, cart-service, order-service]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
