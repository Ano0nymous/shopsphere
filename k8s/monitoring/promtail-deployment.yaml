apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    clients:
      - url: http://loki.monitoring:3100/loki/api/v1/push
    positions:
      filename: /tmp/positions.yaml
    scrape_configs:
      - job_name: product-service
        static_configs:
          - targets: [localhost]
            labels:
              app: product-service
              container: product-service
              namespace: default
              __path__: /var/log/pods/default_product-service*/*/*.log

      - job_name: user-service
        static_configs:
          - targets: [localhost]
            labels:
              app: user-service
              container: user-service
              namespace: default
              __path__: /var/log/pods/default_user-service*/*/*.log

      - job_name: cart-service
        static_configs:
          - targets: [localhost]
            labels:
              app: cart-service
              container: cart-service
              namespace: default
              __path__: /var/log/pods/default_cart-service*/*/*.log

      - job_name: order-service
        static_configs:
          - targets: [localhost]
            labels:
              app: order-service
              container: order-service
              namespace: default
              __path__: /var/log/pods/default_order-service*/*/*.log

      - job_name: redis
        static_configs:
          - targets: [localhost]
            labels:
              app: redis
              container: redis
              namespace: default
              __path__: /var/log/pods/default_redis*/*/*.log

      - job_name: postgres
        static_configs:
          - targets: [localhost]
            labels:
              app: postgres
              container: postgres
              namespace: default
              __path__: /var/log/pods/default_postgres*/*/*.log

      - job_name: frontend
        static_configs:
          - targets: [localhost]
            labels:
              app: frontend
              container: frontend
              namespace: default
              __path__: /var/log/pods/default_frontend*/*/*.log
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promtail
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.8
          args:
            - "-config.file=/etc/promtail/promtail.yaml"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: logs
              mountPath: /var/log
          securityContext:
            runAsUser: 0
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: logs
          hostPath:
            path: /var/log
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - services
      - pods
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring